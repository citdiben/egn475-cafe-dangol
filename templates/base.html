
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Café Calle Ocho{% endblock %}</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >

    <style>
        body {
            background-color: #fffaf2;
        }

        header {
            background-color: #7b2d26;
            color: white;
            padding: 25px 0;
            text-align: center;
        }

        header h1 {
            color: white;
            margin-bottom: 5px;
        }

        nav a {
            color: #7b2d26;
            font-weight: bold;
        }

        main {
            padding-top: 30px;
            padding-bottom: 40px;
        }

        .welcome {
            text-align: center;
            padding: 35px 15px;
            background-color: #f5e4cb;
            border-radius: 12px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <div class="container">
            <h1>Café Calle Ocho</h1>
            <p>Fresh Cuban Flavor, Made with Love</p>
        </div>
    </header>

    <nav class="container">
        <ul>
            <li><a href="{{ url_for('index') }}">Home</a></li>
            <li><a href="{{ url_for('menu') }}">Menu</a></li>
            <li><a href="{{ url_for('order_new') }}">Place Order</a></li>
            <li><a href="{{ url_for('kitchen') }}">Kitchen Board</a></li>
            <li><a href="{{ url_for('orders') }}">Order History</a></li>
        </ul>
    </nav>

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

    <footer>
        <p>&copy; 2026 Café Calle Ocho | Miami, Florida</p>
    </footer>

</body>
</html>
